# Manually triggered: test which sources a GitHub-hosted runner can fetch.
# Actions tab -> "Fetch check" -> Run workflow; read the log of the "Check" step.
name: Fetch check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check
        run: python scripts/check_fetch.py --events
