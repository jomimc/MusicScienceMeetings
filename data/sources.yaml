# Sources: where to look for meetings, and how to read each one.
#
# Fields
#   id        short unique slug (events refer to it as `series`)
#   name      full name
#   kind      conference_series | aggregator | mailing_list | social
#   topics    1-3 of: cognition, neuroscience, auditory, timbre, mir,
#             computational, technology, performance, education, health,
#             language, theory, musicology, ethnomusicology
#             (definitions and dropped candidates: sandbox/tags/proposal.yaml)
#   url       human entry point
#   method    how the pipeline reads it:
#               ical             parse iCal feed at `feed` (no LLM)
#               rss              parse RSS/Atom at `feed` (LLM only on item text)
#               squarespace_json `url`?format=json (+ LLM on excerpts)
#               page             fetch `url` -> trimmed text -> LLM extract
#               page_follow      as page, then follow each event's own link (LLM)
#               url_pattern      try `url_pattern` for this year and next
#               list_archive     scrape mailing-list archive index, LLM on CFP posts
#               bluesky          `feed` (profile RSS) -> LLM on posts
#               manual           no automation possible; human checks
#   feed      feed URL (ical / rss / bluesky / list_archive index)
#   url_pattern  {year} placeholder (url_pattern method)
#   text      preprocessing variant for page methods: v4 (default) | v6 (list
#             pages with repeated records; adds '---' separators)
#   cadence   annual | biennial | triennial | irregular | unknown
#   status    ok | blocked (bot protection) | dead | stale | unknown
#   notes     free text
#   surveyed  date the entry was last checked by hand/agent
#
# See docs/source_survey.md, docs/easy_sources.md, docs/discovery.md.

